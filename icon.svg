<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#748ffc"/>
      <stop offset="100%" stop-color="#cc5de8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Calendar page -->
  <rect x="126" y="100" width="260" height="300" rx="24" fill="white" opacity="0.95"/>
  <rect x="126" y="100" width="260" height="70" rx="24" fill="white"/>
  <rect x="126" y="130" width="260" height="40" fill="white"/>
  <rect x="126" y="100" width="260" height="70" rx="24" fill="rgba(116,143,252,0.15)"/>
  <!-- Calendar binding dots -->
  <circle cx="200" cy="100" r="10" fill="white"/>
  <rect x="194" y="78" width="12" height="34" rx="6" fill="#748ffc"/>
  <circle cx="312" cy="100" r="10" fill="white"/>
  <rect x="306" y="78" width="12" height="34" rx="6" fill="#748ffc"/>
  <!-- Check mark -->
  <polyline points="190,250 230,290 320,200" fill="none" stroke="#748ffc" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small lines (task lines) -->
  <rect x="170" y="330" width="172" height="10" rx="5" fill="#748ffc" opacity="0.25"/>
  <rect x="170" y="356" width="120" height="10" rx="5" fill="#748ffc" opacity="0.15"/>
  <!-- Smile in corner -->
  <circle cx="400" cy="400" r="56" fill="rgba(255,255,255,0.2)"/>
  <circle cx="384" cy="390" r="5" fill="white"/>
  <circle cx="416" cy="390" r="5" fill="white"/>
  <path d="M388,408 Q400,420 412,408" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>
